<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini MN 上传 · 本地验证</title>
<style>body{font:14px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;color:#30343b;background:#f6f7f9;max-width:900px;margin:48px auto;padding:24px}h1{font-size:23px}p{color:#747b88;line-height:1.7}input-container{display:block;margin-top:40px}.text-input-field{background:#fff;border:1px solid #e1e4e9;border-radius:30px;padding:20px 24px}.bottom{display:flex;align-items:center;margin-top:20px;height:40px}.left{flex:1}legal-footer{display:block;text-align:center;color:#858993;font-size:12px;margin-top:12px}simplified-input-menu{display:block;width:40px}gem-icon-button{display:block;width:40px}rich-textarea{display:block;margin:0 4px;min-width:0}.ql-editor{min-height:24px;outline:none;line-height:1.6;white-space:pre-wrap}.ql-editor p{color:inherit;margin:0}.right{display:flex;gap:8px;align-items:center;flex-shrink:0}button{font:inherit;border:0;background:transparent;color:inherit;padding:8px;cursor:pointer}.attachments{display:flex;gap:8px;margin:14px 8px}.attachments span{padding:8px 12px;border:1px solid #dce1eb;background:#fff;border-radius:9px}#result{background:#fff;border:1px solid #e1e4e9;border-radius:12px;padding:16px;margin-top:24px;color:#3b5869}code{display:block;margin-top:12px;color:#818898;overflow-wrap:anywhere;font-size:12px}</style>
<h1>Gemini · 工作流</h1><p>本地模拟双行输入区：工作流原本指定 DeepSeek，从 Gemini 网页执行仍留在 Gemini。仅使用测试图片和文字。</p>
<input-container><div class="input-area"><div class="text-input-field"><input-area-v3><rich-textarea><div class="ql-editor" contenteditable="true" role="textbox" aria-label="为 Gemini 输入提示"><p>原有草稿</p></div></rich-textarea></input-area-v3><div class="bottom"><div class="left"><simplified-input-menu><div><gem-icon-button><button type="button" aria-label="Open upload menu">＋</button></gem-icon-button></div></simplified-input-menu></div><div class="right"><button type="button" aria-label="打开模式选择器">Flash ⌄</button><button type="button" aria-label="语音输入">♩</button></div></div></div></div></input-container><legal-footer>Gemini is AI and can make mistakes.</legal-footer>
<div class="attachments" id="attachments" aria-label="交付的测试附件"></div><p id="result" role="status">点击“＋”旁的三横线，选择工作流。</p><code id="command"></code>
<script>/* AIB_GEMINI_ADAPTER */</script><script>
const editor = document.querySelector('.ql-editor'), output = document.getElementById('result'), files = [];
let requests = 0, sends = 0;
editor.addEventListener('paste', event => {
  if (!event.clipboardData.files.length) return;
  event.preventDefault();
  for (const file of event.clipboardData.files) { files.push(file); const chip = document.createElement('span'); chip.textContent = file.name + ' · ' + file.size + ' 字节'; document.getElementById('attachments').append(chip); }
});
const host = { document, location: { origin: 'https://gemini.google.com', pathname: '/app', get href() { return 'https://gemini.google.com/app'; }, set href(value) {
  document.getElementById('command').textContent = value;
  const url = new URL(value);
  if (url.hostname === 'workflows') { setTimeout(() => bridge.workflowMenu(url.searchParams.get('request'), { items: [{ id: 'wf-check', name: '检查手写', site: 'gemini' }] }), 0); return; }
  if (url.hostname !== 'workflow') return;
  requests++;
  try {
    const bundle = { text: '卡片原文 $x^2$\n第二行\n\n提示词：请检查我的解题过程。', files: [{ name: 'MN手写.png', type: 'image/png', base64: /* AIB_TEST_PNG */, bytes: /* AIB_TEST_BYTES */ }] };
    const data = JSON.stringify(bundle), target = bridge.context(), token = 'test-' + requests;
    bridge.prepare(target, token, data.length); bridge.append(token, 0, data); bridge.commit(token);
    const result = bridge.read(token);
    if (result.status !== 'handed-off' || files.length !== requests || sends !== 0 || !editor.textContent.includes('卡片原文') || !editor.textContent.includes('提示词：')) throw Error(result.message || '校验未通过');
    output.textContent = '通过：留在 Gemini，真实点击已交付 ' + files.length + ' 张 PNG；卡片文字与提示词已追加；自动发送 0 次。'; document.title = 'Gemini MN 上传验证通过';
  } catch (error) { output.textContent = '失败：' + error.message; }
} }, get innerWidth() { return window.innerWidth; }, get innerHeight() { return window.innerHeight; }, MutationObserver, HTMLTextAreaElement, File, DataTransfer, Event, ClipboardEvent, atob: window.atob.bind(window), getSelection: window.getSelection.bind(window),
setTimeout: window.setTimeout.bind(window), clearTimeout: window.clearTimeout.bind(window), setInterval: window.setInterval.bind(window), clearInterval: window.clearInterval.bind(window), addEventListener: window.addEventListener.bind(window), removeEventListener: window.removeEventListener.bind(window) };
const bridge = AIBGeminiModule.createGeminiBridge(host); bridge.connect('gemini-click-test');
</script></html>
