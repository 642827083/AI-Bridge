<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ai Bridge 设置</title><style>/* AIB_STYLE */</style></head>
<body>
<main id="settings-main">
  <div class="settings-navigation-wrap">
    <nav class="settings-navigation" role="tablist" aria-label="设置分类">
      <span class="settings-navigation-slider" aria-hidden="true"></span>
      <button id="workflows-tab" type="button" role="tab" aria-controls="workflows-panel" aria-selected="true">工作流</button>
      <button id="navigation-tab" type="button" role="tab" aria-controls="navigation-panel" aria-selected="false" tabindex="-1">关于插件</button>
    </nav>
  </div>
  <div id="workflows-panel" role="tabpanel" aria-labelledby="workflows-tab">
  <div id="workflows" class="group-heading"><h2>工作流库</h2><div class="workflow-toolbar"><button id="workflow-import" type="button" class="secondary" disabled>导入</button><button id="workflow-export" type="button" class="secondary" disabled>导出</button><button id="workflow-new" type="button" disabled>新增工作流</button></div></div>
  <input id="workflow-file" type="file" accept=".json,application/json" hidden>
  <p class="hint workflow-hint">网页内执行上传到当前 AI；外部联动执行打开指定 AI。选中卡片后，通过三横线选择工作流，内容填入后由你点击发送。</p>
  <section id="workflow-transfer" aria-labelledby="workflow-transfer-title" hidden>
    <div class="workflow-transfer-heading"><h3 id="workflow-transfer-title" tabindex="-1">导入工作流</h3><p id="workflow-transfer-help"></p><div class="workflow-transfer-tools"><span id="workflow-transfer-count"></span><button id="workflow-select-all" class="quiet" type="button">全选</button><button id="workflow-select-none" class="quiet" type="button">清空选择</button></div></div>
    <div id="workflow-transfer-list"></div>
    <p id="workflow-transfer-status" role="status" aria-live="polite"></p>
    <div class="workflow-edit-actions"><button id="workflow-transfer-cancel" class="secondary" type="button">取消</button><button id="workflow-transfer-confirm" type="button">确认导入</button></div>
  </section>
  <section id="workflow-management" aria-label="工作流管理">
    <div id="workflow-list"></div>
    <form id="workflow-editor" hidden>
      <fieldset id="workflow-fields">
        <div class="workflow-editor-heading"><strong id="workflow-editor-title">新增工作流</strong><small>以下设置仅用于这个工作流，点击底部按钮统一保存。</small></div>
        <label class="workflow-name-label" for="workflow-name">工作流名称<input id="workflow-name" type="text" maxlength="24" placeholder="例如：讲解题目" required autocomplete="off"></label>
        <label class="row" for="workflow-site"><span><strong>联动目标网页</strong><small>网页内执行始终上传到当前网页</small></span><select id="workflow-site"><option value="deepseek">DeepSeek</option><option value="doubao">豆包</option><option value="gpt">GPT</option><option value="gemini">Gemini</option></select></label>
        <div class="divider"></div>
        <details id="workflow-card-picker"><summary class="row"><span><strong>上传卡片内容</strong><small>选择卡片第几条，可多选</small></span><span id="workflow-card-summary" class="choice-value">第 1 条</span></summary><div class="workflow-card-fields"><div id="workflow-card-choices" class="choice-grid"></div><div class="choice-actions"><button id="workflow-more" type="button" class="quiet">显示更多条目</button><button id="workflow-less" type="button" class="quiet" hidden>收起条目</button><button id="workflow-clear" type="button" class="quiet">清空选择</button></div></div></details>
        <div class="divider"></div>
        <label class="row" for="workflow-handwriting"><span><strong>上传手写内容</strong><small>选择已保存的手写来源</small></span><select id="workflow-handwriting"><option value="last">卡片最后一条手写</option><option value="mindmap">脑图手写</option><option value="none">无</option></select></label>
        <div class="divider"></div>
        <label class="text-label" for="workflow-prompt"><strong>提示词</strong><small>每次执行时追加在卡片文字之后；可以只填提示词。</small></label><textarea id="workflow-prompt" maxlength="10000" placeholder="这个工作流专用的提示词"></textarea>
        <div class="workflow-edit-actions"><button id="workflow-cancel" type="button" class="secondary">取消</button><button type="submit">保存工作流</button></div>
      </fieldset>
    </form>
  </section>
  <div class="workflow-footer"><p id="workflow-status" role="status" aria-live="polite">正在读取工作流…</p><button id="workflow-refresh" type="button" class="quiet">刷新列表</button></div>
  </div>
  <div id="navigation-panel" role="tabpanel" aria-labelledby="navigation-tab" hidden>
    <div class="group-heading"><h2>关于插件</h2><span>Ai Bridge</span></div>
    <section class="navigation-preferences" aria-label="导航栏显示设置">
      <fieldset id="navigation-fields" disabled>
        <legend>顶部导航显示</legend>
        <div class="navigation-options">
        <label class="navigation-choice"><span>DeepSeek</span><input type="checkbox" value="deepseek" checked></label>
        <label class="navigation-choice"><span>豆包</span><input type="checkbox" value="doubao" checked></label>
        <label class="navigation-choice"><span>GPT</span><input type="checkbox" value="gpt"></label>
        <label class="navigation-choice"><span>Gemini</span><input type="checkbox" value="gemini"></label>
        <label class="navigation-choice navigation-required"><span>设置</span><input type="checkbox" checked disabled></label>
        </div>
      </fieldset>
    </section>
    <p class="hint">至少保留一个网页，设置固定显示。隐藏网页只收起导航入口，已打开的网页和草稿会保留。</p>
    <p id="navigation-status" role="status" aria-live="polite">正在读取导航栏设置…</p>
  </div>
</main>
<script>window.__AIB_SETTINGS_TOKEN__="__AIB_TOKEN_VALUE__";</script>
<script>/* AIB_APP */</script>
</body></html>
